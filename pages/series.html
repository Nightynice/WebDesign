<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ซีรีย์ทั้งหมด | Series Trail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/series.css">
</head>

<body>
    
    <div id="navbar"></div>

    <main>
        <section class="series-hero">
            <div class="container">
                <p class="section-label">SERIES TRAIL</p>
                <h1>ซีรีย์ทั้งหมด</h1>
                <p>
                    สำรวจซีรีย์และสถานที่ตามรอยจากประเทศไทย
                    เกาหลีใต้ ญี่ปุ่น และจีน
                </p>
            </div>
        </section>
        <section class="series-explorer">
            <div class="explorer-container">
                <div class="filter-section">
                    <h2>สำรวจเนื้อหา</h2>
                    <div class="category-filter">
                        <button class="category-btn active" data-category="series">
                            ซีรีย์
                        </button>
                        <button class="category-btn" data-category="places">
                            สถานที่เที่ยว
                        </button>
                        <button class="category-btn" data-category="restaurants">
                            คาเฟ่ / ร้านอาหาร
                        </button>
                        <button class="category-btn" data-category="hotels">
                            ที่พัก
                        </button>
                    </div>
                    <div class="filter-options">
                        <div class="country-filter">
                            <label for="countryFilter">ประเทศ</label>
                            <select id="countryFilter">
                                <option value="all">ทุกประเทศ</option>
                                <option value="ไทย">ไทย</option>
                                <option value="เกาหลีใต้">เกาหลีใต้</option>
                                <option value="ญี่ปุ่น">ญี่ปุ่น</option>
                                <option value="จีน">จีน</option>
                            </select>
                        </div>
                        <div class="search-filter">
                            <label for="searchInput">ค้นหา</label>
                            <div class="search-box">
                                <span><i class="bi bi-search"></i></span>
                                <input type="text" id="searchInput" placeholder="ค้นหา...">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="result-header">
                    <p id="resultCount">พบ 0 รายการ</p>
                </div>
                <div id="contentGrid" class="content-grid"></div>
                <div id="pagination" class="pagination"></div>
            </div>
        </section>
    </main>

    <div id="footer"></div>
    <script src="/js/components.js"></script>
    <script src="/js/places.js"></script>
    <script src="/js/restaurants.js"></script>
    <script src="/js/hotels.js"></script>
    <script src="/js/series.js"></script>
</body>

</html>
