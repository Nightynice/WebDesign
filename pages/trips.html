<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตัวอย่างทริป | Series Trail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/trips.css">
</head>

<body>

    <div id="navbar"></div>

    <main>
        <section class="trips-hero">
            <div class="trips-hero-content">
                <p class="section-label">SERIES TRAIL TRIPS</p>
                <h1>
                    อยากไปที่ไหน?
                </h1>
                <p>
                    รวมตัวอย่างเส้นทางท่องเที่ยวสำหรับคนที่อยากออกไปตามรอยซีรีย์
                </p>
                <div class="trip-search">
                    <i class="bi bi-search"></i>
                    <input type="text" id="tripSearch" placeholder="ค้นหาทริป ประเทศ ซีรีย์ หรือสถานที่">
                </div>
            </div>
        </section>

        <section class="trips-section">
            <div class="trips-container">
                <div class="trips-heading">
                    <div>
                        <p class="section-label">EXPLORE TRIPS</p>
                        <h2>
                            ตัวอย่างทริป
                        </h2>
                        <p class="trips-heading-text">
                            เลือกเส้นทางที่เหมาะกับสไตล์การเที่ยวของคุณ
                            แล้วดูรายละเอียดสถานที่ที่อยู่ในเส้นทาง
                        </p>
                    </div>
                    <span id="tripResultCount" class="trip-result-count">
                        พบ 8 ทริป
                    </span>
                </div>

                <div class="trip-filters">
                    <button class="trip-filter active" data-filter="all">
                        ทั้งหมด
                    </button>
                    <button class="trip-filter" data-filter="ไทย">
                        ไทย
                    </button>
                    <button class="trip-filter" data-filter="เกาหลีใต้">
                        เกาหลีใต้
                    </button>
                    <button class="trip-filter" data-filter="ญี่ปุ่น">
                        ญี่ปุ่น
                    </button>
                    <button class="trip-filter" data-filter="จีน">
                        จีน
                    </button>
                </div>

                <div id="tripGrid" class="trip-grid">
                </div>

                <div id="tripEmpty" class="trip-empty" hidden>
                    <i class="bi bi-search"></i>
                    <h3>
                        ไม่พบทริป
                    </h3>
                    <p>
                        ลองเปลี่ยนคำค้นหาหรือตัวกรอง
                    </p>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="/js/components.js"></script>
    <script src="/js/trips.js"></script>

</body>

</html>
